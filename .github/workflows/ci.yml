name: research-contracts
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: "false"
      - run: uv sync --locked
      - run: uv run python -m unittest discover -s tests -v
      - run: uv run sev validate data/smoke.jsonl
      - run: uv run sev bench data/smoke.jsonl --split smoke --backend rules --out artifacts/ci-rules
      - run: uv build
